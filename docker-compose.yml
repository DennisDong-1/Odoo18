version: "3.9"

services:
  db:
    image: postgres:15
    container_name: odoo18-db
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo18-db-data:/var/lib/postgresql/data

  odoo:
    image: odoo:18
    container_name: odoo18-app
    depends_on:
      - db
    restart: always
    ports:
      - "8070:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo18-web-data:/var/lib/odoo
      - ./custom_addons:/mnt/extra-addons
    # The stock image entrypoint only wires PostgreSQL (HOST/USER/PASSWORD) when argv[1] is `odoo`.
    # A plain `/bin/sh -c ...` bypasses that and Odoo falls back to a local socket.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
          set -e
          MODULES=""
          sep=""
          for d in /mnt/extra-addons/*/; do
            [ -f "$$d/__manifest__.py" ] || continue
            n=$$(basename "$$d")
            MODULES="$$MODULES$$sep$$n"
            sep=","
          done
          if [ -z "$$MODULES" ]; then
            exec /entrypoint.sh odoo -d postgres --dev all
          else
            exec /entrypoint.sh odoo -u "$$MODULES" -d postgres --dev all
          fi

volumes:
  odoo18-db-data:
  odoo18-web-data: